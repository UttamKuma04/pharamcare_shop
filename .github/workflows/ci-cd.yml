name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pharmacare

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmacare_test
          POSTGRES_USER: pharmacare
          POSTGRES_PASSWORD: pharmacare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacare -d pharmacare_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mr_doctor/requirements.txt
      - name: Install dependencies
        working-directory: mr_doctor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django checks and tests
        working-directory: mr_doctor
        env:
          SECRET_KEY: ci-secret
          DEBUG: "False"
          DATABASE_URL: postgres://pharmacare:pharmacare@localhost:5432/pharmacare_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py test

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: mr_doctor
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy staging
        run: echo "Deploy $IMAGE_NAME:${{ github.sha }} to staging via kubectl/Helm or your PaaS CLI"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy production
        run: echo "Promote the verified staging image to production with rolling update and automatic rollback"
